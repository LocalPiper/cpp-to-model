<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C++ AST Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.css">
</head>
<body>
    <header>
        <h1>C++ AST &amp; CFG Explorer</h1>
        <span class="sub">LibTooling AST / CFG &rarr; JSON + SVG &rarr; browser</span>
    </header>

    <div class="toolbar">
        <button id="parseBtn" class="primary" type="button">Parse</button>

        <div class="sample-menu">
            <button id="samplesBtn" type="button">Samples &#9662;</button>
            <div id="samplesDropdown" class="dropdown" hidden>
                <div id="samplesList" class="dropdown-list"></div>
                <div class="dropdown-sep"></div>
                <button id="manageSamplesBtn" class="dropdown-item" type="button">Manage samples&hellip;</button>
            </div>
        </div>

        <button id="saveSampleBtn" type="button">Save as sample&hellip;</button>
        <span id="status">Ready.</span>
    </div>

    <div class="main">
        <div class="panel">
            <div class="panel-title">C++ source</div>
            <textarea id="codeInput" spellcheck="false" placeholder="Paste C++ code here..."></textarea>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span class="tabs">
                    <button id="tabAst" class="tab-btn active" type="button">AST</button>
                    <button id="tabCfg" class="tab-btn" type="button">CFG</button>
                </span>
                <span id="viewTitle">AST picture (hover nodes for details)</span>
            </div>
            <div id="svgBox"><div class="placeholder">Paste C++ code and press Parse...</div></div>
            <div id="diagnostics" hidden></div>
            <details>
                <summary id="jsonSummary">Raw AST (JSON)</summary>
                <pre id="jsonBox"></pre>
            </details>
        </div>
    </div>

    <div id="saveModal" class="modal" hidden>
        <div class="modal-backdrop"></div>
        <div class="modal-body">
            <h2>Save sample</h2>
            <label>Name
                <input id="saveName" type="text" placeholder="e.g. Range-based for loop">
            </label>
            <label>Description
                <textarea id="saveDesc" rows="3" placeholder="Short description of what this sample demonstrates"></textarea>
            </label>
            <div class="modal-actions">
                <button id="saveCancel" type="button">Cancel</button>
                <button id="saveConfirm" class="primary" type="button">Save</button>
            </div>
            <div id="saveError" class="modal-error" hidden></div>
        </div>
    </div>

    <!-- CodeMirror 5 (core + C++ mode + useful addons) -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchtags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/selection/active-line.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
